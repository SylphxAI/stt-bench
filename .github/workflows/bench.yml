name: bench

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            label: "GitHub-hosted macos-14 (M1, 3 vCPU VM)"
          - runner: windows-latest
            label: "GitHub-hosted windows-latest (x64, 4 vCPU VM)"
          - runner: ubuntu-latest
            label: "GitHub-hosted ubuntu-latest (x64, 4 vCPU VM)"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    name: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned sherpa-onnx
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Bench
        run: python bench.py --label "${{ matrix.label }}" --out result-${{ matrix.runner }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: result-${{ matrix.runner }}
          path: result-${{ matrix.runner }}.json
